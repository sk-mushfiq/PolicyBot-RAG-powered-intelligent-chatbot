# ─────────────────────────────────────────────────────
# HR PolicyBot — Docker Compose
# Services: backend (FastAPI) + frontend (Streamlit)
# ─────────────────────────────────────────────────────

version: "3.9"

services:

  # ── FastAPI Backend ──────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr_policybot_api
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db       # Persist vector store
      - ./data:/app/data                 # Mount sample documents
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_DIR=/app/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Streamlit Frontend ───────────────────────────
  frontend:
    image: python:3.11-slim
    container_name: hr_policybot_ui
    working_dir: /app
    volumes:
      - ./frontend:/app/frontend
      - ./requirements.txt:/app/requirements.txt
    command: >
      sh -c "pip install --no-cache-dir streamlit requests &&
             streamlit run frontend/streamlit_app.py
             --server.port=8501
             --server.address=0.0.0.0
             --server.headless=true"
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - API_BASE_URL=http://backend:8000
    restart: unless-stopped

volumes:
  chroma_data:
