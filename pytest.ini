# pytest.ini
# ──────────────────────────────────────────────────────
# Pytest configuration for HR PolicyBot test suite
# ──────────────────────────────────────────────────────

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    --verbose
    --tb=short
    --strict-markers
    -p no:warnings

# Async support
asyncio_mode = auto

# Custom markers
markers =
    unit: Pure unit tests with no external dependencies
    integration: Tests that require the API to be running
    slow: Tests that take more than 2 seconds
